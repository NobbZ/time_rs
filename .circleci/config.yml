version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/rust:1.90.0
    steps:
      - checkout
      - run:
          name: "Install cargo-nextest"
          command: "cargo install cargo-nextest --locked"
      - run:
          name: "Build all targets"
          command: "cargo build --all-targets"
      - run:
          name: "Run tests"
          command: "cargo nextest run --no-fail-fast || cargo test"

  pre_commit_checks:
    docker:
      - image: cimg/rust:1.90.0
    steps:
      - checkout
      - run:
          name: "Install pre-commit"
          command: |
            pip3 install --user pre-commit
            echo 'export PATH=$HOME/.local/bin:$PATH' >> $BASH_ENV
      - run:
          name: "Install cargo tools"
          command: |
            cargo install cargo-audit --locked
            cargo install cargo-deny --locked
      - run:
          name: "Run pre-commit hooks"
          command: |
            # Skip Nix-dependent hooks (alejandra, coverage-validate)
            SKIP=alejandra,coverage-validate pre-commit run --all-files --verbose

workflows:
  build_and_test_workflow:
    jobs:
      - build_and_test
      - pre_commit_checks
